# Local Querulus monitoring 1:1 with contour: MSSQL + Airflow(SQLite) + Grafana
# Usage: cp .env.example .env  # fill passwords, then:
#        docker compose up -d --build
#
# UI credentials: see .env (GF_SECURITY_ADMIN_*, _AIRFLOW_WWW_USER_*)
# Dashboard: Import JSON from ../pipeline/querulus_monitoring.json

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: local/airflow/Dockerfile
  env_file:
    - .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/db/airflow.db
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
    _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    QUERULUS_USE_SYNTHETIC: "1"
    QUERULUS_DAG_MODE: bash
    # Pipeline env — стиль MONITORING_BUU
    motor_host: ${motor_host}
    motor_name: ${motor_name}
    motor_user_name: ${motor_user_name}
    motor_user_pass: ${motor_user_pass}
    LOCAL_SYNTHETIC_DIR: /opt/querulus/monitoring/local/synthetic
    SYNTHETIC_DATA_DIR: /opt/querulus/monitoring/local/synthetic/data
    GENERATE_SCRIPT: /opt/querulus/monitoring/local/synthetic/generate.py
    PYTHONPATH: /opt/querulus/monitoring:/opt/querulus_repo:/opt/querulus_repo/examples/querulus/src
    PIPELINE_DIR: /opt/querulus/monitoring/pipeline
  volumes:
    - ../dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/db:/opt/airflow/db
    - ../pipeline:/opt/querulus/monitoring/pipeline
    - ./synthetic:/opt/querulus/monitoring/local/synthetic
    - ../../../..:/opt/querulus_repo:ro
  depends_on:
    mssql-init:
      condition: service_completed_successfully
  restart: on-failure

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U \"$$MSSQL_USER\" -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file:
      - .env
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_USER: ${MSSQL_USER}
    volumes:
      - ./mssql/init.sql:/init.sql:ro
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U "$$MSSQL_USER" -P "$$MSSQL_SA_PASSWORD" -C -i /init.sql
    restart: "no"

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/db
        airflow db migrate
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        python /opt/querulus/monitoring/local/synthetic/generate.py \
          --out /opt/querulus/monitoring/local/synthetic/data
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:10.4.2
    env_file:
      - .env
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
      # For datasource provisioning substitution
      MSSQL_USER: ${MSSQL_USER}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_DATABASE: ${MSSQL_DATABASE}
      MSSQL_HOST: ${MSSQL_HOST}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mssql-data:

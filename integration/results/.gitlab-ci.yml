stages:
  - deploytest
  - deployprod

variables:
  GIT_STRATEGY: clone
  REGISTRY: repo.vsk.ru:5018
  REPO_PREFIX: rtdm
  USERNAME: gitlab-runner
  TEST_SERVER_ADDRESS: perf-pydsp-test-w1.vsk.ru
  DEPLOY_LOCATION: /opt/models/querulus-registry

deploy_test:
  stage: deploytest
  tags:
    - perftest
  script:
    - ssh -tt "$USERNAME"@"$TEST_SERVER_ADDRESS" mkdir -p $DEPLOY_LOCATION
    - scp -i ~/.ssh/id_rsa -rp * "$USERNAME"@"$TEST_SERVER_ADDRESS":$DEPLOY_LOCATION
  rules:
  - if: '$CI_COMMIT_REF_NAME == "test" && $CI_PIPELINE_SOURCE == "push"'

deploy_prod:
  stage: deployprod
  tags:
    - perfprod
  script:
    - ssh -tt "$USERNAME"@"$PROD_WORKER1" mkdir -p $DEPLOY_LOCATION
    - scp -i ~/.ssh/id_rsa -rp * "$USERNAME"@"$PROD_WORKER1":$DEPLOY_LOCATION
    - ssh -tt "$USERNAME"@"$PROD_WORKER2" mkdir -p $DEPLOY_LOCATION
    - scp -i ~/.ssh/id_rsa -rp * "$USERNAME"@"$PROD_WORKER2":$DEPLOY_LOCATION
    - ssh -tt "$USERNAME"@"$PROD_WORKER3" mkdir -p $DEPLOY_LOCATION
    - scp -i ~/.ssh/id_rsa -rp * "$USERNAME"@"$PROD_WORKER3":$DEPLOY_LOCATION
  rules:
  - if: '$CI_COMMIT_REF_NAME == "prod" && $CI_PIPELINE_SOURCE == "push"'

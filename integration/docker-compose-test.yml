version: '3.8'

services:
  querulus:
    image: repo.vsk.ru:5018/rtdm/querulus:2.0.0
    deploy:
      placement:
        constraints: [node.labels.type == service]
      mode: replicated
      replicas: 1
      restart_policy:
        delay: 10s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    networks:
      - rtdm-network
    volumes:
      - /opt/models/querulus-registry/models/:/home/model_user/list_models/
    ports:
      - "PLACEHOLDER:8080"
    logging:
      driver: loki
      options:
        loki-url: "http://perf-pydsp-master2.vsk.ru:3100/loki/api/v1/push"

networks:
  rtdm-network:
    external: true
